# Core network configuration parameters for lemonade-server (lemond)
# For local connection only (Default)
HOST="localhost"
PORT="13305"

# For network connection (listen on all interfaces)
# HOST="0.0.0.0"

# Security and access credentials (uncomment and edit to activate)
# export HF_TOKEN="insert_huggingface_token_here"

# Hardware and runtime accelerator overrides
# Necessary wrapper for proper GFX detection on AMD Ryzen AI platforms
# export HSA_OVERRIDE_GFX_VERSION=11.5.0

# CUDA Compute backend isolation (uncomment to restrict or force specific NVIDIA GPUs)
# export CUDA_VISIBLE_DEVICES="0"
